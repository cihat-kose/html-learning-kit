<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Member Registration Form</title>
    </head>
    <body>
        <h1>Member Registration Form:</h1>
        <form name="kayit" action="" method="get">
            <label for="idadsoyad">Name Surname:</label>
            <br>
            <input type="text" name="adsoyad" id="idadsoyad"
            size="20" maxlength="30" required>
            <br>
            <label for="idemail">Email :</label>
            <br>
            <input type="email" name="email" id="idemail" required>
            <br>
            <label for="idadres">Website:</label>
            <br>
            <input type="url" name="adres" id="idadres">
            <br>
            <label for="idyas">Your Age:</label>
            <br>           
             <input type="number" name="yas" id="idyas">
             <br>
             <input type="submit" value="Submit">
            <input type="reset" value="Clear">
        </form>
    </body>
</html>
