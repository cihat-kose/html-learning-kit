<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Checkboxes and Radio Buttons</title>
    </head>
    <body>
        <h1>Checkbox</h1>
        <form name="onay">
            <input type="checkbox" name="bulten" id="bulten">
            <label for="bulten">Subscribe to newsletter</label>
            <br>
            <input type="checkbox" name="medeni" id="medeni">
            <label for="medeni">Married</label>
            <br>
            <br>
            <input type="submit" value="Confirm">
            <input type="reset"  value="Clear">
        </form>
        <h1>Radio Buttons</h1>
        <form name="secenek">
            <h2>Your Favorite Sport</h2>
            <input type="radio" name="spor" id="futbol" value="futbol" checked>
            <label for="futbol">Football</label>
            <input type="radio" name="spor" id="basketbol" value="basketbol">
            <label for="basketbol">Basketball</label>
            <input type="radio" name="spor" id="voleybol" value="voleybol">
            <label for="voleybol">Volleyball</label>
            <br>
            <br>
            <input type="submit" value="Send">
            <input type="reset"  value="Clear">

        </form>
    </body>
</html>
