<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Checkboxes and Radio Buttons</title>
    </head>
    <body>
        <h1>Checkbox</h1>
        <form name="onay">
            <input type="checkbox" name="bulten">Subscribe to newsletter
            <br>
            <input type="checkbox" name="medeni">Married
            <br>
            <br>
            <input type="submit" value="Confirm">
            <input type="reset"  value="Clear">
        </form>
        <h1>Radio Buttons</h1>
        <form name="secenek">
            <h2>Your Favorite Sport</h2>
            <input type="radio" name="spor" value="futbol" checked>Football
            <input type="radio" name="spor" value="basketbol">Basketball
            <input type="radio" name="spor" value="voleybol">Volleyball
            <br>
            <br>
            <input type="submit" value="Send">
            <input type="reset"  value="Clear">

        </form>
    </body>
</html>
